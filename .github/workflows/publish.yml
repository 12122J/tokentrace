name: Publish to npm

# Publishes @j___avi/tokentrace to npm using a Trusted Publisher (OIDC).
# No NPM_TOKEN secret is required: GitHub mints a short-lived identity token,
# npm verifies it matches the trusted publisher you configured, and provenance
# is attached automatically.
#
# How to release (one push):
#   npm version patch        # bumps package.json + package-lock + creates the v* tag
#   git push --follow-tags   # pushes the commit AND the tag -> this workflow runs
# Or trigger manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release for the pushed tag
  id-token: write # REQUIRED for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard (so the published dist is never stale)
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Run checks
        run: npm run check

      - name: Publish
        run: npm publish --access public

      - name: Create GitHub Release for the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
