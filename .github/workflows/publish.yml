name: Publish to npm

# Publishes @j___avi/tokentrace to npm using a Trusted Publisher (OIDC).
# No NPM_TOKEN secret is required: GitHub mints a short-lived identity token,
# npm verifies it matches the trusted publisher you configured, and provenance
# is attached automatically.
#
# How to release:
#   1. Bump the version in package.json (e.g. npm version patch)
#   2. Push the tag, then create a GitHub Release for it
#   3. This workflow runs on the published release and publishes to npm
# Or trigger manually from the Actions tab (workflow_dispatch).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Publish
        run: npm publish --access public
